name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-proxy:
    name: Build & deploy SMTP proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/build-push-action@v6
        with:
          context: smtp
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/famio-smtp:latest
      - name: Redeploy on GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo docker pull ghcr.io/${{ github.repository_owner }}/famio-smtp:latest
            sudo systemctl restart famio-smtp

  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-proxy]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"
      - name: Terraform init
        working-directory: infra
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform init
      - name: Terraform apply
        working-directory: infra
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="smtp_relay_secret=${{ secrets.SMTP_RELAY_SECRET }}" \
            -var="ghcr_image=ghcr.io/${{ github.repository_owner }}/famio-smtp:latest" \
            -var="deploy_ssh_pubkey=${{ secrets.GCP_SSH_PUBKEY }}"
