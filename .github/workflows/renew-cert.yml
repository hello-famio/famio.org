name: Renew SMTP cert

# Manual fallback for when certbot's automatic renewal on the VM stops working.
# Prints the renewal timer state and recent certbot logs (so we can see why it
# broke), renews the Let's Encrypt cert, then checks the live cert from outside.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force renewal even if the cert isn't due (Let's Encrypt allows 5 duplicate certs a week)"
        type: boolean
        default: false

jobs:
  renew:
    name: Renew smtp.famio.org cert
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and renew on GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script_stop: true
          script: |
            echo "=== certbot.timer ==="
            sudo systemctl status certbot.timer --no-pager || true
            echo "=== certbot log (last 60 days) ==="
            sudo journalctl -u certbot --since "-60d" --no-pager | tail -60 || true
            echo "=== certificates ==="
            sudo certbot certificates
            echo "=== renew ==="
            sudo certbot renew ${{ inputs.force && '--force-renewal' || '' }}
            # Make sure automatic renewal is scheduled from here on
            sudo systemctl enable --now certbot.timer
            # Deploy hook restarts stunnel4 on renewal; restart anyway in case the hook is missing
            sudo systemctl restart stunnel4

      - name: Verify live cert
        run: |
          end=$(echo | openssl s_client -connect smtp.famio.org:587 -starttls smtp -servername smtp.famio.org 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          echo "smtp.famio.org cert expires: $end"
          if ! echo | openssl s_client -connect smtp.famio.org:587 -starttls smtp -servername smtp.famio.org 2>/dev/null \
            | openssl x509 -noout -checkend $((14 * 24 * 3600)); then
            echo "::error::Cert still expires within 14 days — renewal did not take effect"
            exit 1
          fi
