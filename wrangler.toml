name = "famio-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Worker routes — applied automatically on `bun run deploy`.
# Routes only the API paths so GitHub Pages continues serving index.html at /.
routes = [
  { pattern = "famio.org/signup",          zone_name = "famio.org" },
  { pattern = "famio.org/confirm*",        zone_name = "famio.org" },
  { pattern = "famio.org/manage*",         zone_name = "famio.org" },
  { pattern = "famio.org/unsubscribe*",    zone_name = "famio.org" },
  { pattern = "famio.org/internal/smtp-send", zone_name = "famio.org" },
]

# D1 database binding.
[[d1_databases]]
binding = "DB"
database_name = "famio"
database_id = "1adaa7b9-8bfc-4669-b326-447a16dfe8ac"

# Environment variables.
# Set the Purelymail API token as a secret in production:
#   wrangler secret put PURELYMAIL_API_KEY
# Without it the Worker falls back to a stub that logs what it would send.
#
# Local dev overrides live in .dev.vars (gitignored).
[vars]
FAMIO_DOMAIN = "famio.org"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Staging environment — used for deploy-based dev on macOS 12 (wrangler dev --remote
# requires macOS 13.5+ due to miniflare's local proxy requirement).
# Deploy with: bun run deploy:staging
# Test at: https://famio-worker-staging.bevn.workers.dev
[env.staging]
name = "famio-worker-staging"
routes = []  # staging uses workers.dev URL only — no custom routes
[[env.staging.d1_databases]]
binding = "DB"
database_name = "famio-staging"
database_id = "4aa5cf2c-0789-412a-a7be-830bdb7cd773"
[env.staging.vars]
FAMIO_DOMAIN = "famio.org"
