name = "famio-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding.
# For local dev: wrangler creates a SQLite file in .wrangler/state/ automatically.
# For production: run `wrangler d1 create famio` and replace the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "famio"
database_id = "1adaa7b9-8bfc-4669-b326-447a16dfe8ac"

# Environment variables.
# Set the Purelymail API token as a secret in production:
#   wrangler secret put PURELYMAIL_API_KEY
# Without it the Worker falls back to a stub that logs what it would send.
#
# Local dev overrides live in .dev.vars (gitignored).
[vars]
FAMIO_DOMAIN = "famio.org"

# Staging environment — used for deploy-based dev on macOS 12 (wrangler dev --remote
# requires macOS 13.5+ due to miniflare's local proxy requirement).
# Deploy with: bun run deploy:staging
# Test at: https://famio-worker-staging.bevn.workers.dev
[env.staging]
name = "famio-worker-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "famio-staging"
database_id = "4aa5cf2c-0789-412a-a7be-830bdb7cd773"
[env.staging.vars]
FAMIO_DOMAIN = "famio.org"
